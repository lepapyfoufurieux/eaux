# Production-like stack: Caddy (HTTPS, frontend, photos) + Django + PostGIS.
# Usage: cp .env.example .env && docker compose up -d --build

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      # Reference geodata, for import_geodata and seed_demo; tiles writable for download_tiles.py.
      - ./data:/data:ro
      - ./data/tiles:/data/tiles

  web:
    build:
      context: .
      dockerfile: ops/caddy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
      - ./data/tiles:/srv/tiles:ro
      - caddy_data:/data

volumes:
  pgdata:
  media:
  static:
  caddy_data:
